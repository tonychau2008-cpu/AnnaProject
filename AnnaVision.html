<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ANNA 2.0 - SUPREME VISION</title>
  <style>
    body { background: #000; color: #0ff; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
    .vision-grid { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .cam-box { border: 2px solid #0ff; border-radius: 10px; background: #050505; width: 45%; min-width: 320px; padding: 10px; box-shadow: 0 0 10px #0ff; }
    video { width: 100%; border-radius: 8px; border: 1px solid #f0f; background: #111; aspect-ratio: 16/9; }
    select { width: 100%; background: #111; color: #0ff; border: 1px solid #0ff; margin-top: 5px; padding: 5px; }
    .control-panel { border: 2px solid #f0f; border-radius: 15px; padding: 20px; display: inline-block; width: 90%; background: rgba(255,0,255,0.05); }
    .input-url { width: 90%; padding: 10px; background: #111; border: 1px solid #0ff; color: #0ff; border-radius: 5px; margin-bottom: 10px; }
    .btn { padding: 12px 30px; font-weight: bold; border: none; cursor: pointer; border-radius: 50px; margin: 5px; }
    #powerBtn { background: #0ff; color: #000; }
    #micBtn { background: #f0f; color: #fff; }
    #micBtn.active { background: #0f0; color: #000; box-shadow: 0 0 20px #0f0; }
    #reply { color: #0f0; font-size: 22px; font-weight: bold; margin-top: 15px; text-shadow: 0 0 5px #0f0; }
  </style>
</head>
<body>
  <h2>💠 ANNA VISION PRO 2.0</h2>
  <input type="text" id="gasUrl" class="input-url" placeholder="Dán link /exec mới vào đây...">
  <div class="vision-grid">
    <div class="cam-box"><video id="v1" autoplay playsinline muted></video><select id="s1" onchange="switchCam(1)"></select></div>
    <div class="cam-box"><video id="v2" autoplay playsinline muted></video><select id="s2" onchange="switchCam(2)"></select></div>
  </div>
  <div class="control-panel">
    <button id="powerBtn" class="btn" onclick="initSys()">🔥 TỈNH THỨC</button>
    <button id="micBtn" class="btn" onclick="toggleMic()">🎤 NÓI VỚI ANNA</button>
    <div id="reply"></div>
  </div>
  <script>
    let streams = {1:null, 2:null}, rec, isH = false, synth = window.speechSynthesis;
    async function initSys() {
      const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === 'videoinput');
      [1,2].forEach(n => {
        const sel = document.getElementById('s'+n);
        sel.innerHTML = cams.map((c, i) => `<option value="${c.deviceId}">${c.label || 'Cam '+i}</option>`).join('');
        if(n===2 && cams.length > 1) sel.selectedIndex = cams.findIndex(c => c.label.toLowerCase().includes('camo')) || 1;
      });
      stream.getTracks().forEach(t => t.stop());
      switchCam(1); switchCam(2); setupAI();
      synth.speak(new SpeechSynthesisUtterance(""));
      document.getElementById('reply').innerText = "Anna 2.0 đã sẵn sàng.";
    }
    async function switchCam(n) {
      const id = document.getElementById('s'+n).value;
      if(streams[n]) streams[n].getTracks().forEach(t => t.stop());
      streams[n] = await navigator.mediaDevices.getUserMedia({video: {deviceId: id}});
      document.getElementById('v'+n).srcObject = streams[n];
    }
    function setupAI() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      rec = new SR(); rec.lang = 'vi-VN';
      rec.onresult = (e) => {
        const txt = e.results[0][0].transcript;
        const url = document.getElementById('gasUrl').value;
        document.getElementById('reply').innerText = "...";
        fetch(url + "?q=" + encodeURIComponent(txt)).then(r => r.text()).then(d => {
          const clean = d.replace(/<[^>]*>/g, '').trim();
          document.getElementById('reply').innerText = clean;
          const u = new SpeechSynthesisUtterance(clean); u.lang='vi-VN'; u.pitch=1.4; synth.speak(u);
        });
      };
      rec.onend = () => { isH=false; document.getElementById('micBtn').classList.remove('active'); };
    }
    function toggleMic() { if(!isH) { rec.start(); isH=true; document.getElementById('micBtn').classList.add('active'); } else { rec.stop(); } }
    window.onload = () => { document.getElementById('reply').innerText = "Nhấn TỈNH THỨC để bắt đầu."; };
  </script>
</body>
</html>
