<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANNA IDOL MASTER 2026</title>
    <style>
        :root { --neon: #0ff; --pink: #f0f; --bg: #000; --green: #0f0; }
        body { background: var(--bg); color: var(--neon); font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 10px; overflow-x: hidden; }
        h2 { text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon); margin: 10px 0; font-size: 20px; }
        .vision-grid { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .cam-box { border: 2px solid var(--neon); border-radius: 15px; background: #050505; width: 45%; min-width: 300px; padding: 8px; box-shadow: 0 0 15px rgba(0,255,255,0.1); }
        video { width: 100%; aspect-ratio: 16/9; border-radius: 10px; border: 1px solid var(--pink); object-fit: cover; background: #111; }
        select { width: 100%; background: #111; color: var(--neon); border: 1px solid var(--neon); margin-top: 8px; padding: 5px; border-radius: 5px; font-size: 12px; }
        .control-panel { border: 2px solid var(--pink); border-radius: 20px; padding: 20px; background: rgba(255,0,255,0.05); display: inline-block; width: 90%; max-width: 700px; }
        .input-url { width: 95%; padding: 10px; background: #111; border: 1px solid var(--neon); color: var(--neon); margin-bottom: 15px; border-radius: 8px; outline: none; text-align: center; font-size: 12px; }
        .btn-group { display: flex; justify-content: center; gap: 15px; }
        .btn { padding: 12px 30px; font-weight: bold; border: none; cursor: pointer; border-radius: 50px; font-size: 14px; text-transform: uppercase; transition: 0.3s; }
        #pBtn { background: var(--neon); color: #000; box-shadow: 0 0 10px var(--neon); }
        #mBtn { background: var(--pink); color: #fff; box-shadow: 0 0 10px var(--pink); }
        #mBtn.active { background: var(--green); color: #000; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        #status { color: #888; font-size: 12px; margin-top: 10px; min-height: 18px; }
        #reply { color: var(--green); font-size: 24px; font-weight: bold; margin-top: 15px; min-height: 60px; text-shadow: 0 0 8px rgba(0,255,0,0.3); padding: 0 10px; line-height: 1.3; }
    </style>
</head>
<body>
    <h2>💠 ANNA IDOL MASTER 2026</h2>
    <input type="text" id="gasUrl" class="input-url" placeholder="Dán link /exec bản mới nhất vào đây...">
    <div class="vision-grid">
        <div class="cam-box"><video id="v1" autoplay playsinline muted></video><select id="s1" onchange="switchCam(1)"></select></div>
        <div class="cam-box"><video id="v2" autoplay playsinline muted></video><select id="s2" onchange="switchCam(2)"></select></div>
    </div>
    <div class="control-panel">
        <div class="btn-group">
            <button id="pBtn" class="btn" onclick="wakeUp()">⚡ Tỉnh Thức</button>
            <button id="mBtn" class="btn" onclick="toggleMic()">🎤 Nói Với Anna</button>
        </div>
        <div id="status">Sẵn sàng chờ lệnh...</div>
        <div id="reply">Chào chủ nhân!</div>
    </div>
    <script>
        let streams = {1:null, 2:null}, rec, isL = false, synth = window.speechSynthesis;
        window.onload = () => { if(localStorage.getItem('annaUrl')) document.getElementById('gasUrl').value = localStorage.getItem('annaUrl'); };
        async function wakeUp() {
            try {
                await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                const devs = await navigator.mediaDevices.enumerateDevices();
                const cams = devs.filter(d => d.kind === 'videoinput');
                [1,2].forEach(n => {
                    const sel = document.getElementById('s'+n);
                    sel.innerHTML = cams.map((c, i) => `<option value="${c.deviceId}">${c.label || 'Cam ' + i}</option>`).join('');
                    if(n === 2 && cams.length > 1) {
                        const cIdx = cams.findIndex(c => c.label.toLowerCase().includes('camo'));
                        sel.selectedIndex = cIdx !== -1 ? cIdx : 1;
                    }
                });
                switchCam(1); switchCam(2); setupAI();
                synth.speak(new SpeechSynthesisUtterance(""));
                document.getElementById('status').innerText = "HỆ THỐNG ONLINE!";
            } catch (e) { alert("Hãy cấp quyền Camera/Mic!"); }
        }
        async function switchCam(n) {
            const id = document.getElementById('s'+n).value;
            if(streams[n]) streams[n].getTracks().forEach(t => t.stop());
            streams[n] = await navigator.mediaDevices.getUserMedia({video: {deviceId: id}});
            document.getElementById('v'+n).srcObject = streams[n];
        }
        function setupAI() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            rec = new SR(); rec.lang = 'vi-VN';
            rec.onresult = (e) => {
                const txt = e.results[0][0].transcript;
                document.getElementById('status').innerText = "Bạn: " + txt;
                ask(txt);
            };
            rec.onend = () => { isL = false; document.getElementById('mBtn').classList.remove('active'); };
        }
        function toggleMic() { if(!isL) { rec.start(); isL = true; document.getElementById('mBtn').classList.add('active'); } else { rec.stop(); } }
        function ask(msg) {
            const url = document.getElementById('gasUrl').value.trim();
            localStorage.setItem('annaUrl', url);
            document.getElementById('reply').innerText = "Anna đang nảy số... ✨";
            fetch(url + "?q=" + encodeURIComponent(msg))
                .then(r => r.text())
                .then(d => {
                    document.getElementById('reply').innerText = d;
                    const u = new SpeechSynthesisUtterance(d); u.lang='vi-VN'; u.pitch=1.4; synth.speak(u);
                })
                .catch(() => { document.getElementById('reply').innerText = "Mạng yếu hoặc chưa dán đúng link /exec!"; });
        }
    </script>
</body>
</html>
