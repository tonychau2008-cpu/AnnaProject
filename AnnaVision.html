<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANNA IDOL MASTER 2026</title>
  <style>
    :root { --neon: #0ff; --pink: #f0f; --bg: #000; --green: #0f0; --err: #ff4444; }
    body { background: var(--bg); color: var(--neon); font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 15px; }
    
    h2 { text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon); }

    /* Khung nhìn Camera */
    .vision-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
    .cam-box { border: 2px solid var(--neon); border-radius: 15px; background: #050505; width: 45%; min-width: 320px; padding: 10px; box-shadow: 0 0 15px rgba(0,255,255,0.1); transition: 0.3s; }
    video { width: 100%; aspect-ratio: 16/9; border-radius: 10px; border: 1px solid var(--pink); object-fit: cover; background: #111; }
    select { width: 100%; background: #111; color: var(--neon); border: 1px solid var(--neon); margin-top: 10px; padding: 8px; border-radius: 5px; cursor: pointer; }

    /* Bảng điều khiển */
    .control-panel { border: 2px solid var(--pink); border-radius: 25px; padding: 25px; background: rgba(255,0,255,0.05); display: inline-block; width: 90%; max-width: 800px; }
    .input-url { width: 94%; padding: 12px; background: #111; border: 1px solid var(--neon); color: var(--neon); margin-bottom: 15px; border-radius: 10px; outline: none; text-align: center; font-size: 13px; }
    
    .btn-group { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
    .btn { padding: 15px 35px; font-weight: bold; border: none; cursor: pointer; border-radius: 50px; font-size: 16px; text-transform: uppercase; transition: 0.3s; }
    #pBtn { background: var(--neon); color: #000; box-shadow: 0 0 10px var(--neon); }
    #mBtn { background: var(--pink); color: #fff; box-shadow: 0 0 10px var(--pink); }
    #mBtn.active { background: var(--green); color: #000; animation: pulse 1s infinite; }
    
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    /* Phản hồi */
    #status { color: #888; font-size: 13px; margin-top: 10px; min-height: 20px; }
    #reply { color: var(--green); font-size: 26px; font-weight: bold; margin-top: 20px; min-height: 70px; text-shadow: 0 0 10px rgba(0,255,0,0.3); padding: 0 10px; }
    .error { color: var(--err) !important; text-shadow: 0 0 10px var(--err) !important; }
  </style>
</head>
<body>

  <h2>💠 ANNA IDOL MASTER - ONLINE</h2>
  
  <input type="text" id="gasUrl" class="input-url" placeholder="Dán link /exec (Version mới nhất) vào đây...">

  <div class="vision-grid">
    <div class="cam-box"><video id="v1" autoplay playsinline muted></video><select id="s1" onchange="switchCam(1)"></select></div>
    <div class="cam-box"><video id="v2" autoplay playsinline muted></video><select id="s2" onchange="switchCam(2)"></select></div>
  </div>

  <div class="control-panel">
    <div class="btn-group">
      <button id="pBtn" class="btn" onclick="wakeUp()">⚡ TỈNH THỨC</button>
      <button id="mBtn" class="btn" onclick="toggleMic()">🎤 NÓI VỚI ANNA</button>
    </div>
    <div id="status">Đang chờ chủ nhân kích hoạt hệ thống...</div>
    <div id="reply">Chào chủ nhân!</div>
  </div>

  <script>
    let activeStreams = {1:null, 2:null}, rec, isL = false, synth = window.speechSynthesis;

    window.onload = () => {
      const saved = localStorage.getItem('annaMasterUrl');
      if(saved) document.getElementById('gasUrl').value = saved;
    };

    async function wakeUp() {
      document.getElementById('status').innerText = "Đang kết nối thị giác & thính giác...";
      try {
        await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        const devs = await navigator.mediaDevices.enumerateDevices();
        const cams = devs.filter(d => d.kind === 'videoinput');
        
        [1,2].forEach(n => {
          const sel = document.getElementById('s'+n);
          sel.innerHTML = cams.map((c, i) => `<option value="${c.deviceId}">${c.label || 'Camera ' + i}</option>`).join('');
          if(n === 2 && cams.length > 1) {
            const camoIdx = cams.findIndex(c => c.label.toLowerCase().includes('camo'));
            sel.selectedIndex = camoIdx !== -1 ? camoIdx : 1;
          }
        });

        await switchCam(1); await switchCam(2);
        setupAI();
        synth.speak(new SpeechSynthesisUtterance("")); // Mở khóa âm thanh
        document.getElementById('status').innerText = "HỆ THỐNG MASTER ĐÃ SẴN SÀNG!";
      } catch (e) {
        document.getElementById('status').innerText = "Lỗi: Hãy cấp quyền Camera/Mic!";
      }
    }

    async function switchCam(n) {
      const id = document.getElementById('s'+n).value;
      if(activeStreams[n]) activeStreams[n].getTracks().forEach(t => t.stop());
      const st = await navigator.mediaDevices.getUserMedia({video: {deviceId: id}});
      activeStreams[n] = st;
      document.getElementById('v'+n).srcObject = st;
    }

    function setupAI() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert("Trình duyệt không hỗ trợ nhận diện giọng nói!");
      rec = new SR();
      rec.lang = 'vi-VN';
      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        document.getElementById('status').innerText = "Chủ nhân nói: " + text;
        askAnna(text);
      };
      rec.onend = () => { isL = false; document.getElementById('mBtn').classList.remove('active'); };
    }

    function toggleMic() {
      if(!isL) { rec.start(); isL = true; document.getElementById('mBtn').classList.add('active'); }
      else { rec.stop(); }
    }

    function askAnna(msg) {
      const url = document.getElementById('gasUrl').value.trim();
      if(!url) return alert("Vui lòng dán link /exec!");
      localStorage.setItem('annaMasterUrl', url);
      
      const replyDiv = document.getElementById('reply');
      replyDiv.classList.remove('error');
      replyDiv.innerText = "Anna đang tư duy... ✨";

      // Sử dụng Timeout 15 giây để tránh treo máy khi mạng lag
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);

      fetch(url + "?q=" + encodeURIComponent(msg), { signal: controller.signal })
        .then(res => res.text())
        .then(data => {
          clearTimeout(timeout);
          replyDiv.innerText = data;
          speak(data);
        })
        .catch(err => {
          replyDiv.classList.add('error');
          replyDiv.innerText = "Mạng yếu hoặc Anna đang bận. Chủ nhân thử lại nhé!";
        });
    }

    function speak(t) {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'vi-VN';
      const voices = synth.getVoices();
      const female = voices.find(v => v.lang.includes('vi') && (v.name.includes('Female') || v.name.includes('nữ') ||
