<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ANNA 2.0 SUPREME</title>
  <style>
    body { background: #000; color: #0ff; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; }
    .vision-grid { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .cam-box { border: 2px solid #0ff; border-radius: 10px; width: 45%; min-width: 300px; padding: 10px; background: #050505; }
    video { width: 100%; aspect-ratio: 16/9; border-radius: 8px; border: 1px solid #f0f; background: #111; }
    .control { border: 2px solid #f0f; border-radius: 20px; padding: 20px; margin-top: 15px; background: rgba(255,0,255,0.05); }
    .input-url { width: 90%; padding: 10px; background: #111; border: 1px solid #0ff; color: #0ff; margin-bottom: 15px; }
    .btn { padding: 15px 40px; font-weight: bold; border: none; cursor: pointer; border-radius: 50px; margin: 5px; font-size: 16px; }
    #powerBtn { background: #0ff; color: #000; }
    #micBtn { background: #f0f; color: #fff; }
    #micBtn.active { background: #0f0; color: #000; box-shadow: 0 0 20px #0f0; }
    #reply { color: #0f0; font-size: 24px; font-weight: bold; margin-top: 15px; min-height: 50px; }
  </style>
</head>
<body>
  <h2>💠 ANNA VISION PRO 2.0</h2>
  <input type="text" id="gasUrl" class="input-url" placeholder="Dán link /exec mới vào đây...">
  <div class="vision-grid">
    <div class="cam-box"><video id="v1" autoplay playsinline muted></video><select id="s1" onchange="chCam(1)"></select></div>
    <div class="cam-box"><video id="v2" autoplay playsinline muted></video><select id="s2" onchange="chCam(2)"></select></div>
  </div>
  <div class="control">
    <button id="powerBtn" class="btn" onclick="init()">⚡ KÍCH HOẠT</button>
    <button id="micBtn" class="btn" onclick="talk()">🎤 NÓI VỚI ANNA</button>
    <div id="reply"></div>
  </div>
  <script>
    let streams = {1:null, 2:null}, rec, isL = false, synth = window.speechSynthesis;
    async function init() {
      await navigator.mediaDevices.getUserMedia({video:true, audio:true});
      const devs = await navigator.mediaDevices.enumerateDevices();
      const cams = devs.filter(d => d.kind === 'videoinput');
      [1,2].forEach(n => {
        const sel = document.getElementById('s'+n);
        sel.innerHTML = cams.map((c,i) => `<option value="${c.deviceId}">${c.label || 'Cam '+i}</option>`).join('');
        if(n===2) {
          const camoIdx = cams.findIndex(c => c.label.toLowerCase().includes('camo'));
          sel.selectedIndex = camoIdx !== -1 ? camoIdx : (cams.length > 1 ? 1 : 0);
        }
      });
      chCam(1); chCam(2); setupAI();
      synth.speak(new SpeechSynthesisUtterance("")); // Mở khóa âm thanh
      document.getElementById('reply').innerText = "Anna 2.0 đã sẵn sàng.";
    }
    async function chCam(n) {
      const id = document.getElementById('s'+n).value;
      if(streams[n]) streams[n].getTracks().forEach(t => t.stop());
      streams[n] = await navigator.mediaDevices.getUserMedia({video: {deviceId: id}});
      document.getElementById('v'+n).srcObject = streams[n];
    }
    function setupAI() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      rec = new SR(); rec.lang = 'vi-VN';
      rec.onresult = (e) => {
        const txt = e.results[0][0].transcript;
        const url = document.getElementById('gasUrl').value;
        document.getElementById('reply').innerText = "Anna đang suy nghĩ...";
        fetch(url + "?q=" + encodeURIComponent(txt)).then(r => r.text()).then(d => {
          const clean = d.replace(/<[^>]*>/g, '').trim();
          document.getElementById('reply').innerText = clean;
          speak(clean);
        });
      };
      rec.onend = () => { isL=false; document.getElementById('micBtn').classList.remove('active'); };
    }
    function talk() { if(!isL) { rec.start(); isL=true; document.getElementById('micBtn').classList.add('active'); } else { rec.stop(); } }
    function speak(t) {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(t); u.lang = 'vi-VN';
      const vs = synth.getVoices();
      const f = vs.find(v => v.lang.includes('vi') && (v.name.includes('Female') || v.name.includes('nữ') || v.name.includes('Google')));
      if(f) u.voice = f;
      u.pitch = 1.4; synth.speak(u);
    }
    window.speechSynthesis.onvoiceschanged = () => synth.getVoices();
  </script>
</body>
</html>
