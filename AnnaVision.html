<body>
  <h2>💠 ANNA VISION PRO - CAMO OPTIMIZED</h2>
  <input type="text" id="gasUrl" class="input-url" placeholder="Dán link /exec vào đây...">

  <div class="vision-grid">
    <div class="cam-box">
      <video id="v1" autoplay playsinline muted></video>
      <select id="s1" onchange="switchCam(1)"></select>
    </div>
    <div class="cam-box">
      <video id="v2" autoplay playsinline muted></video>
      <select id="s2" onchange="switchCam(2)"></select>
    </div>
  </div>

  <div class="control-center">
    <div class="btn-group">
      <button class="btn btn-power" onclick="wakeUpAnna()">🔥 TỈNH THỨC HỆ THỐNG</button>
      <button id="micBtn" class="btn btn-mic" onclick="toggleMic()">🎤 NÓI VỚI ANNA</button>
    </div>
    <div id="status">Hãy đảm bảo Camo Studio đang mở trên PC...</div>
    <div id="reply-text"></div>
  </div>

  <script>
    let activeStreams = {1:null, 2:null}, rec, isListening = false;
    let synth = window.speechSynthesis;

    // 1. HÀM TỈNH THỨC: QUÉT SẠCH THIẾT BỊ VÀ ƯU TIÊN CAMO
    async function wakeUpAnna() {
      document.getElementById('status').innerText = "Đang tìm mắt Camo...";
      try {
        // Yêu cầu quyền để Chrome "nhả" danh sách thiết bị
        await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        
        [1,2].forEach(n => {
          const sel = document.getElementById('s'+n);
          sel.innerHTML = cams.map((c, i) => 
            `<option value="${c.deviceId}">${c.label || 'Camera ' + i}</option>`
          ).join('');
          
          // CHIẾN THUẬT: Tự động tìm thiết bị có tên "Camo" để gán vào Cam 2
          if(n === 2) {
             const camoIdx = cams.findIndex(c => c.label.toLowerCase().includes('camo'));
             if(camoIdx !== -1) sel.selectedIndex = camoIdx;
             else if(cams.length > 1) sel.selectedIndex = 1;
          }
        });

        switchCam(1); switchCam(2);
        setupRecognition();
        document.getElementById('status').innerText = "Đã tìm thấy " + cams.length + " mắt!";
      } catch (e) {
        document.getElementById('status').innerText = "Lỗi: Hãy bấm vào ổ khóa trên thanh địa chỉ để cho phép Cam/Mic.";
      }
    }

    async function switchCam(n) {
      const id = document.getElementById('s'+n).value;
      if(!id) return;
      if(activeStreams[n]) activeStreams[n].getTracks().forEach(t => t.stop());
      const st = await navigator.mediaDevices.getUserMedia({video: {deviceId: {exact: id}}});
      activeStreams[n] = st;
      document.getElementById('v'+n).srcObject = st;
    }

    // 2. TAI (SPEECH RECOGNITION)
    function setupRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;
      rec = new SR(); rec.lang = 'vi-VN';
      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        document.getElementById('status').innerText = "Bạn nói: " + text;
        askBrain(text);
      };
      rec.onend = () => { isListening = false; document.getElementById('micBtn').classList.remove('active'); };
    }

    function toggleMic() {
      if(!isListening) { rec.start(); isListening = true; document.getElementById('micBtn').classList.add('active'); }
      else { rec.stop(); }
    }

    // 3. NÃO (GỌI GEMINI QUA GAS)
    function askBrain(msg) {
      const url = document.getElementById('gasUrl').value;
      if(!url) return alert("Chưa dán link /exec!");
      document.getElementById('reply-text').innerText = "Anna đang suy nghĩ...";
      fetch(url + "?q=" + encodeURIComponent(msg))
        .then(res => res.text())
        .then(data => {
          const clean = data.replace(/<[^>]*>/g, '').trim();
          document.getElementById('reply-text').innerText = clean;
          speak(clean);
        });
    }

    // 4. MIỆNG (ÉP GIỌNG NỮ VIỆT NAM)
    function speak(t) {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'vi-VN';
      
      const voices = synth.getVoices();
      // Ưu tiên tìm giọng nữ của Google hoặc Microsoft trên trình duyệt
      const female = voices.find(v => v.lang.includes('vi') && (v.name.includes('Female') || v.name.includes('nữ') || v.name.includes('Google')));
      if(female) u.voice = female;
      
      u.pitch = 1.5; // Cao độ Idol
      u.rate = 1.0;
      synth.speak(u);
    }
    
    window.speechSynthesis.onvoiceschanged = () => synth.getVoices();
    window.onload = () => { document.getElementById('status').innerText = "Hãy bật Camo Studio, sau đó nhấn TỈNH THỨC."; };
  </script>
</body>
