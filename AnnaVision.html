<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ANNA VISION PRO - TOTAL CONTROL</title>
  <style>
    body { background: #000; color: #0ff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 15px; }
    .vision-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .cam-card { border: 2px solid #0ff; padding: 5px; border-radius: 12px; background: #050505; width: 46%; min-width: 300px; }
    video { width: 100%; aspect-ratio: 16/9; border-radius: 8px; border: 1px solid #f0f; object-fit: cover; background: #111; }
    select { width: 100%; background: #111; color: #0ff; border: 1px solid #0ff; margin-bottom: 10px; padding: 5px; }
    .control-panel { margin-top: 20px; border: 2px solid #ff00ff; padding: 20px; border-radius: 20px; background: rgba(255,0,255,0.05); }
    .script-input { width: 85%; padding: 12px; background: #111; border: 1px solid #0ff; color: #0ff; margin-bottom: 15px; }
    .btn-mic { background: #ff00ff; color: #fff; border: none; padding: 15px 50px; font-weight: bold; cursor: pointer; border-radius: 50px; font-size: 16px; box-shadow: 0 0 15px #ff00ff; }
    .btn-mic.active { background: #0f0; color: #000; box-shadow: 0 0 25px #0f0; }
    #reply { color: #0f0; font-size: 22px; font-weight: bold; margin-top: 15px; min-height: 40px; }
  </style>
</head>
<body>
  <h2>💠 ANNA AI SYSTEM - VERSION 5.0</h2>
  <input type="text" id="gasUrl" class="script-input" placeholder="Dán link /exec vào đây...">

  <div class="vision-grid">
    <div class="cam-card">
      <select id="sel1" onchange="startCam(1)"></select>
      <video id="v1" autoplay playsinline muted></video>
    </div>
    <div class="cam-card">
      <select id="sel2" onchange="startCam(2)"></select>
      <video id="v2" autoplay playsinline muted></video>
    </div>
  </div>

  <div class="control-panel">
    <button id="micBtn" class="btn-mic" onclick="toggleMic()">🎤 BẤM ĐỂ NÓI VỚI ANNA</button>
    <div id="reply"></div>
  </div>

  <script>
    let activeStreams = {1:null, 2:null}, rec, isH = false;
    let synth = window.speechSynthesis;

    async function init() {
      // 1. LIỆT KÊ TẤT CẢ CAMERA
      const stream = await navigator.mediaDevices.getUserMedia({video: true});
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === 'videoinput');
      
      [1,2].forEach(n => {
        const sel = document.getElementById('sel'+n);
        sel.innerHTML = cams.map((c, i) => `<option value="${c.deviceId}">${c.label || 'Camera '+i}</option>`).join('');
        if(n === 2 && cams.length > 1) sel.selectedIndex = 1;
      });
      stream.getTracks().forEach(t => t.stop());
      startCam(1); startCam(2); setupAI();
    }

    async function startCam(n) {
      const id = document.getElementById('sel'+n).value;
      if(activeStreams[n]) activeStreams[n].getTracks().forEach(t => t.stop());
      const st = await navigator.mediaDevices.getUserMedia({video: {deviceId: id}});
      activeStreams[n] = st;
      document.getElementById('v'+n).srcObject = st;
    }

    function setupAI() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      rec = new SR(); rec.lang = 'vi-VN';
      rec.onresult = (e) => {
        const txt = e.results[0][0].transcript;
        const url = document.getElementById('gasUrl').value;
        document.getElementById('reply').innerText = "Anna đang suy nghĩ...";
        fetch(url + "?q=" + encodeURIComponent(txt))
          .then(res => res.text())
          .then(data => {
            const clean = data.replace(/<[^>]*>/g, '').trim();
            document.getElementById('reply').innerText = clean;
            speak(clean);
          });
      };
      rec.onend = () => { isH = false; document.getElementById('micBtn').classList.remove('active'); };
    }

    function toggleMic() {
      if(!isH) { rec.start(); isH=true; document.getElementById('micBtn').classList.add('active'); }
      else { rec.stop(); }
    }

    // 🚀 CHỈNH GIỌNG NỮ THUẦN VIỆT
    function speak(t) {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'vi-VN';
      
      // Tìm giọng nữ Việt Nam trong hệ thống
      const voices = synth.getVoices();
      const nu = voices.find(v => v.lang.includes('vi') && (v.name.includes('Female') || v.name.includes('nữ') || v.name.includes('Google')));
      if(nu) u.voice = nu;
      
      u.pitch = 1.3; // Cao độ nữ tính
      u.rate = 1.0;
      synth.speak(u);
    }
    // Load giọng đọc khi hệ thống sẵn sàng
    window.speechSynthesis.onvoiceschanged = () => synth.getVoices();
    window.onload = init;
  </script>
</body>
</html>
