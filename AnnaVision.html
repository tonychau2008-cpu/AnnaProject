<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>ANNA IDOL MASTER 2026</title>
  <style>
    :root { --neon: #0ff; --pink: #f0f; --bg: #000; }
    body { background: var(--bg); color: var(--neon); font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 15px; }
    .vision-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 25px; }
    .cam-box { border: 2px solid var(--neon); border-radius: 15px; background: #050505; width: 46%; min-width: 330px; padding: 10px; box-shadow: 0 0 20px rgba(0,255,255,0.2); transition: 0.3s; }
    .cam-box:hover { box-shadow: 0 0 30px var(--neon); }
    video { width: 100%; aspect-ratio: 16/9; border-radius: 10px; border: 1px solid var(--pink); object-fit: cover; background: #111; }
    select { width: 100%; background: #111; color: var(--neon); border: 1px solid var(--neon); margin-top: 10px; padding: 8px; border-radius: 5px; cursor: pointer; }
    
    .control-center { border: 2px solid var(--pink); border-radius: 25px; padding: 30px; background: rgba(255,0,255,0.05); display: inline-block; width: 85%; max-width: 800px; }
    .input-url { width: 92%; padding: 12px; background: #111; border: 1px solid var(--neon); color: var(--neon); margin-bottom: 20px; border-radius: 10px; outline: none; }
    
    .btn-group { display: flex; justify-content: center; gap: 20px; }
    .btn { padding: 15px 45px; font-weight: bold; border: none; cursor: pointer; border-radius: 50px; font-size: 16px; text-transform: uppercase; transition: 0.3s; letter-spacing: 1px; }
    #pBtn { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); }
    #mBtn { background: var(--pink); color: #fff; box-shadow: 0 0 15px var(--pink); }
    #mBtn.active { background: #0f0; color: #000; box-shadow: 0 0 30px #0f0; animation: pulse 1s infinite; }
    
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    #reply { color: #0f0; font-size: 28px; font-weight: bold; margin-top: 25px; text-shadow: 0 0 10px #0f0; min-height: 60px; line-height: 1.4; }
    #status { color: #888; font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>💠 ANNA IDOL MASTER 2026 - ONLINE</h2>
  
  <input type="text" id="gasUrl" class="input-url" placeholder="Dán link /exec mới nhất của Anna vào đây...">

  <div class="vision-grid">
    <div class="cam-box">
      <video id="v1" autoplay playsinline muted></video>
      <select id="s1" onchange="switchCam(1)"></select>
    </div>
    <div class="cam-box">
      <video id="v2" autoplay playsinline muted></video>
      <select id="s2" onchange="switchCam(2)"></select>
    </div>
  </div>

  <div class="control-center">
    <div class="btn-group">
      <button id="pBtn" class="btn" onclick="wakeUp()">⚡ Tỉnh Thức Hệ Thống</button>
      <button id="mBtn" class="btn" onclick="toggleMic()">🎤 Nói với Anna</button>
    </div>
    <div id="status">Sẵn sàng nhận lệnh từ chủ nhân...</div>
    <div id="reply"></div>
  </div>

  <script>
    let activeStreams = {1:null, 2:null}, rec, isL = false;
    let synth = window.speechSynthesis;

    // Tự động load lại link GAS cũ nếu đã từng dán
    window.onload = () => {
      const savedUrl = localStorage.getItem('annaGasUrl');
      if(savedUrl) document.getElementById('gasUrl').value = savedUrl;
    };

    async function wakeUp() {
      document.getElementById('status').innerText = "Đang kết nối ngũ quan...";
      try {
        await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        
        [1,2].forEach(n => {
          const sel = document.getElementById('s'+n);
          sel.innerHTML = cams.map((c, i) => `<option value="${c.deviceId}">${c.label || 'Camera ' + i}</option>`).join('');
          
          // Ưu tiên chọn Camo cho khung số 2
          if(n === 2) {
            const camoIdx = cams.findIndex(c => c.label.toLowerCase().includes('camo'));
            if(camoIdx !== -1) sel.selectedIndex = camoIdx;
            else if(cams.length > 1) sel.selectedIndex = 1;
          }
        });

        switchCam(1); switchCam(2);
        setupAI();
        synth.speak(new SpeechSynthesisUtterance("")); // Mở khóa âm thanh trình duyệt
        document.getElementById('status').innerText = "ANNA IDOL MASTER ĐÃ SẴN SÀNG!";
        document.getElementById('reply').innerText = "Chào chủ nhân, Anna đã tỉnh giấc.";
      } catch (e) {
        document.getElementById('status').innerText = "Lỗi: Hãy cấp quyền Camera/Mic trên trình duyệt!";
      }
    }

    async function switchCam(n) {
      const id = document.getElementById('s'+n).value;
      if(!id) return;
      if(activeStreams[n]) activeStreams[n].getTracks().forEach(t => t.stop());
      const st = await navigator.mediaDevices.getUserMedia({video: {deviceId: {exact: id}}});
      activeStreams[n] = st;
      document.getElementById('v'+n).srcObject = st;
    }

    function setupAI() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert("Trình duyệt không hỗ trợ nhận diện giọng nói!");
      rec = new SR();
      rec.lang = 'vi-VN';
      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        document.getElementById('status').innerText = "Bạn vừa nói: " + text;
        askAnna(text);
      };
      rec.onend = () => { isL = false; document.getElementById('mBtn').classList.remove('active'); };
    }

    function toggleMic() {
      if(!isL) { rec.start(); isL = true; document.getElementById('mBtn').classList.add('active'); }
      else { rec.stop(); }
    }

    function askAnna(msg) {
      const url = document.getElementById('gasUrl').value;
      if(!url) return alert("Chủ nhân chưa dán link /exec!");
      localStorage.setItem('annaGasUrl', url); // Lưu lại link cho lần sau
      
      document.getElementById('reply').innerText = "Anna đang tư duy...";
      fetch(url + "?q=" + encodeURIComponent(msg))
        .then(res => res.text())
        .then(data => {
          const clean = data.replace(/<[^>]*>/g, '').trim();
          document.getElementById('reply').innerText = clean;
          speak(clean);
        })
        .catch(err => {
          document.getElementById('reply').innerText = "Lỗi kết nối: Chủ nhân hãy kiểm tra link /exec!";
        });
    }

    function speak(t) {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'vi-VN';
      const voices = synth.getVoices();
      const female = voices.find(v => v.lang.includes('vi') && (v.name.includes('Female') || v.name.includes('nữ') || v.name.includes('Google')));
      if(female) u.voice = female;
      u.pitch = 1.4; // Ép giọng nữ cao Idol
      u.rate = 1.0;
      synth.speak(u);
    }
    
    window.speechSynthesis.onvoiceschanged = () => synth.getVoices();
  </script>
</body>
</html>
