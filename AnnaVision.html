<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ANNA VISION 2.0 - SUPREME</title>
  <style>
    body { background: #000; color: #0ff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 15px; }
    .vision-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .cam-box { border: 2px solid #0ff; border-radius: 15px; background: #050505; width: 45%; min-width: 320px; padding: 10px; box-shadow: 0 0 15px #0ff; }
    video { width: 100%; aspect-ratio: 16/9; border-radius: 10px; border: 1px solid #f0f; object-fit: cover; background: #111; }
    select { width: 100%; background: #111; color: #0ff; border: 1px solid #0ff; margin-top: 10px; padding: 8px; border-radius: 5px; }
    
    .control-panel { border: 2px solid #f0f; border-radius: 20px; padding: 25px; background: rgba(255,0,255,0.05); display: inline-block; width: 85%; }
    .input-url { width: 90%; padding: 12px; background: #111; border: 1px solid #0ff; color: #0ff; margin-bottom: 15px; border-radius: 8px; }
    
    .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 10px; }
    .btn { padding: 15px 35px; font-weight: bold; border: none; cursor: pointer; border-radius: 50px; font-size: 16px; transition: 0.3s; box-shadow: 0 0 15px currentColor; }
    #powerBtn { background: #0ff; color: #000; }
    #micBtn { background: #f0f; color: #fff; }
    #micBtn.active { background: #0f0; color: #000; box-shadow: 0 0 25px #0f0; }
    
    #reply { color: #0f0; font-size: 24px; font-weight: bold; margin-top: 20px; text-shadow: 0 0 10px #0f0; min-height: 50px; }
    #status { color: #888; font-style: italic; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>💠 ANNA VISION PRO 2.0 - TOTAL AWAKENING</h2>
  <input type="text" id="gasUrl" class="input-url" placeholder="Dán link /exec (Não 2.0) vào đây...">

  <div class="vision-grid">
    <div class="cam-box"><video id="v1" autoplay playsinline muted></video><select id="s1" onchange="switchCam(1)"></select></div>
    <div class="cam-box"><video id="v2" autoplay playsinline muted></video><select id="s2" onchange="switchCam(2)"></select></div>
  </div>

  <div class="control-panel">
    <div class="btn-group">
      <button id="powerBtn" class="btn" onclick="initSystem()">⚡ KÍCH HOẠT HỆ THỐNG</button>
      <button id="micBtn" class="btn" onclick="toggleMic()">🎤 NÓI VỚI ANNA</button>
    </div>
    <div id="status">Sẵn sàng nhận lệnh từ chủ nhân...</div>
    <div id="reply"></div>
  </div>

  <script>
    let activeStreams = {1:null, 2:null}, rec, isH = false;
    let synth = window.speechSynthesis;

    async function initSystem() {
      document.getElementById('status').innerText = "Đang quét mắt Camo và PC...";
      try {
        await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        
        [1,2].forEach(n => {
          const sel = document.getElementById('s'+n);
          sel.innerHTML = cams.map((c, i) => `<option value="${c.deviceId}">${c.label || 'Cam '+i}</option>`).join('');
          // Tự động tìm Camo cho Cam 2
          if(n === 2) {
            const camoIdx = cams.findIndex(c => c.label.toLowerCase().includes('camo'));
            sel.selectedIndex = camoIdx !== -1 ? camoIdx : (cams.length > 1 ? 1 : 0);
          }
        });
        
        switchCam(1); switchCam(2);
        setupAI();
        synth.speak(new SpeechSynthesisUtterance("")); // Mở khóa âm thanh
        document.getElementById('status').innerText = "Hệ thống Anna 2.0 đã tỉnh thức!";
      } catch (e) { document.getElementById('status').innerText = "Lỗi khởi động: " + e.message; }
    }

    async function switchCam(n) {
      const id = document.getElementById('s'+n).value;
      if(activeStreams[n]) activeStreams[n].getTracks().forEach(t => t.stop());
      const st = await navigator.mediaDevices.getUserMedia({video: {deviceId: id}});
      activeStreams[n] = st;
      document.getElementById('v'+n).srcObject = st;
    }

    function setupAI() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      rec = new SR(); rec.lang = 'vi-VN';
      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        document.getElementById('status').innerText = "Chủ nhân: " + text;
        askBrain(text);
      };
      rec.onend = () => { isH = false; document.getElementById('micBtn').classList.remove('active'); };
    }

    function toggleMic() {
      if(!isH) { rec.start(); isH = true; document.getElementById('micBtn').classList.add('active'); }
      else { rec.stop(); }
    }

    function askBrain(msg) {
      const url = document.getElementById('gasUrl').value;
      if(!url) return alert("Vui lòng dán link /exec!");
      document.getElementById('reply').innerText = "Anna đang suy nghĩ...";
      fetch(url + "?q=" + encodeURIComponent(msg))
        .then(res => res.text())
        .then(data => {
          const clean = data.replace(/<[^>]*>/g, '').trim();
          document.getElementById('reply').innerText = clean;
          speak(clean);
        });
    }

    function speak(t) {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'vi-VN';
      const voices = synth.getVoices();
      const female = voices.find(v => v.lang.includes('vi') && (v.name.includes('Female') || v.name.includes('nữ') || v.name.includes('Google')));
      if(female) u.voice = female;
      u.pitch = 1.4; // Ép giọng nữ cao
      u.rate = 1.0;
      synth.speak(u);
    }
    
    window.speechSynthesis.onvoiceschanged = () => synth.getVoices();
  </script>
</body>
</html>
